          - Barangay Emergency Response Team
          - Coast Guard
          - Disaster Risk Reduction Office
          - Electric Utility
          - Fire Department
          - Hospital
          - Other
          - Police
          - Rescue Team
          - Social Welfare Office
          - Water Utility
        description: |-
          * `Police` - Police
          * `Fire Department` - Fire Department
          * `Ambulance` - Ambulance
          * `Hospital` - Hospital
          * `Disaster Risk Reduction Office` - Disaster Risk Reduction Office
          * `Rescue Team` - Rescue Team
          * `Coast Guard` - Coast Guard
          * `Barangay Emergency Response Team` - Barangay Emergency Response Team
          * `Social Welfare Office` - Social Welfare Office
          * `Electric Utility` - Electric Utility
          * `Water Utility` - Water Utility
          * `Other` - Other
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: province
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Citizen – Emergency Contacts
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCitizenContactList'
          description: ''
  /api/citizen/emergency-contacts/{id}/:
