components:
  schemas:
    AlertTranslation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        language:
          $ref: '#/components/schemas/SupportedLanguageCodeEnum'
        status:
          $ref: '#/components/schemas/TranslationStatusEnum'
        version:
          type: integer
          readOnly: true
        published_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        translated_title:
          type: string
          maxLength: 255
        translated_message:
          type: string
        translated_instructions:
          type: string
        translated_affected_area_description:
          type: string
        created_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        updated_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        alert:
          type: string
          format: uuid
      required:
      - alert
      - created_at
      - created_by
      - id
      - language
      - published_at
      - translated_message
      - translated_title
      - updated_at
      - updated_by
      - version
    AlertTypeEnum:
      enum:
      - Earthquake
      - Flood
      - Typhoon
      - Fire
      - Landslide
      - Tsunami
      - Volcanic Eruption
      - Medical Emergency
      - Road Closure
      - Missing Person
      - Evacuation Notice
      - Weather Advisory
      - Public Safety
      - General Emergency
      type: string
      description: |-
        * `Earthquake` - Earthquake
        * `Flood` - Flood
        * `Typhoon` - Typhoon
        * `Fire` - Fire
        * `Landslide` - Landslide
        * `Tsunami` - Tsunami
        * `Volcanic Eruption` - Volcanic Eruption
        * `Medical Emergency` - Medical Emergency
        * `Road Closure` - Road Closure
        * `Missing Person` - Missing Person
        * `Evacuation Notice` - Evacuation Notice
        * `Weather Advisory` - Weather Advisory
        * `Public Safety` - Public Safety
        * `General Emergency` - General Emergency
    Audit:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user_email:
          type: string
          format: email
          readOnly: true
        action:
          type: string
          maxLength: 40
        module:
          type: string
          maxLength: 60
        record_id:
          type: string
          maxLength: 64
        record_description:
          type: string
          maxLength: 255
        previous_values: {}
        new_values: {}
        ip_address:
          type: string
          nullable: true
        user_agent:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        user:
          type: string
          format: uuid
          nullable: true
      required:
      - action
      - created_at
      - id
      - module
      - user_email
    AvailabilityEnum:
      enum:
      - 24/7
      - Office Hours
      - On Call
      - Temporarily Unavailable
      type: string
      description: |-
        * `24/7` - 24/7
        * `Office Hours` - Office Hours
        * `On Call` - On Call
        * `Temporarily Unavailable` - Temporarily Unavailable
    AvailabilityStatusEnum:
      enum:
      - Available
      - Limited
      - Full
      - Closed
      type: string
      description: |-
        * `Available` - Available
        * `Limited` - Limited
        * `Full` - Full
        * `Closed` - Closed
    CalamityTranslation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        language:
          $ref: '#/components/schemas/SupportedLanguageCodeEnum'
        status:
          $ref: '#/components/schemas/TranslationStatusEnum'
        version:
          type: integer
          readOnly: true
        published_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
