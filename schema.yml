          * `Clothing` - Clothing
          * `Important Documents` - Important Documents
          * `Tools and Equipment` - Tools and Equipment
          * `Hygiene` - Hygiene
          * `Emergency Supplies` - Emergency Supplies
          * `Baby Supplies` - Baby Supplies
          * `Senior Citizen Supplies` - Senior Citizen Supplies
          * `Pet Supplies` - Pet Supplies
          * `Other` - Other
      - in: query
        name: is_required
