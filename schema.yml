openapi: 3.0.3
info:
  title: Hazard Hero API
  version: 1.0.0
  description: Public Citizen and JWT-protected Administrator/Responder APIs
paths:
  /api/citizen/alerts/:
    get:
      operationId: citizen_alerts_list
      parameters:
      - in: query
        name: alert_type
        schema:
          type: string
          enum:
          - Earthquake
          - Evacuation Notice
          - Fire
          - Flood
          - General Emergency
          - Landslide
          - Medical Emergency
          - Missing Person
          - Public Safety
          - Road Closure
          - Tsunami
          - Typhoon
          - Volcanic Eruption
          - Weather Advisory
        description: |-
          * `Earthquake` - Earthquake
          * `Flood` - Flood
          * `Typhoon` - Typhoon
          * `Fire` - Fire
          * `Landslide` - Landslide
          * `Tsunami` - Tsunami
          * `Volcanic Eruption` - Volcanic Eruption
          * `Medical Emergency` - Medical Emergency
          * `Road Closure` - Road Closure
          * `Missing Person` - Missing Person
          * `Evacuation Notice` - Evacuation Notice
          * `Weather Advisory` - Weather Advisory
          * `Public Safety` - Public Safety
          * `General Emergency` - General Emergency
      - in: query
        name: barangay
        schema:
          type: string
      - in: query
        name: city_municipality
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: province
        schema:
          type: string
      - in: query
        name: region
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: severity_level
        schema:
          type: string
          enum:
          - Advisory
          - Critical
          - Information
          - Severe
          - Warning
        description: |-
          * `Information` - Information
          * `Advisory` - Advisory
          * `Warning` - Warning
          * `Severe` - Severe
          * `Critical` - Critical
      tags:
      - Citizen – Alerts
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCitizenAlertList'
          description: ''
  /api/citizen/alerts/{id}/:
    get:
      operationId: citizen_alerts_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this emergency alert.
        required: true
      tags:
      - Citizen – Alerts
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CitizenAlert'
          description: ''
